# The bare domain that the news, mail and recall page write: the same bot protection as www.

host = "ampvale.com"

[[route]]
method = "GET"
path = "/recall"
status = 403
content_type = "text/html; charset=utf-8"
body = "hidden/mocks/ampvale/blocked.html"

[[route]]
method = "GET"
path = "/"
status = 403
content_type = "text/html; charset=utf-8"
body = "hidden/mocks/ampvale/blocked.html"
