[workspace]
members = ["provider-protocol", "openai-compatible", "deepseek", "typesafe"]
resolver = "3"
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
[workspace.dependencies]
wit-bindgen = "0.62.0"
serde_json = "1.0.151"
provider-protocol = { path = "provider-protocol" }
[profile.release]
opt-level = "s"
lto = true
strip = true

# Copy of the root `[workspace.lints]`, differing only in `unsafe_code`; `cargo xtask check`
# rejects any other difference.
[workspace.lints.rust]
# Plugins write no unsafe by hand; the generated canonical ABI glue is accepted with
# `expect`. The Wasm sandbox, not this lint, protects the host (docs/spec/02 §5).
unsafe_code = "deny"

[workspace.lints.clippy]
# Production code propagates errors with context instead of panicking. In a plugin a
# panic is a trap, which health gating attributes to the generation (§4.6).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
# Diagnostics go through the `log` import, which attributes them to the plugin.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Every suppression states why.
allow_attributes_without_reason = "deny"
