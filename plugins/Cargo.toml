[workspace]
members = ["provider-protocol", "provider-openai", "provider-deepseek"]
resolver = "3"
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
[workspace.dependencies]
wit-bindgen = "0.62.0"
serde_json = "1.0.151"
provider-protocol = { path = "provider-protocol" }
[profile.release]
opt-level = "s"
lto = true
strip = true
