[package]
name = "test-fixture"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
enco-sdk = { path = "../../sdk" }

[profile.release]
opt-level = "s"
lto = true
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Production code propagates errors with context instead of panicking.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
# Diagnostics go through tracing in the host and the `log` import in plugins.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Every suppression states why.
allow_attributes_without_reason = "deny"
# A function fits in one reading; a longer one splits by responsibility, or a flat
# dispatch states why with `expect`. Files have their own limit in `cargo xtask check`.
too_many_lines = "deny"
