[workspace]
members = ["crates/*", "apps/enco", "xtask"]
exclude = ["sdk", "plugins/*", "evals/runner"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.53", default-features = false }
tokio-util = "0.7.19"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.3"
rustdoc-types = "0.61.0"                 # matches the pinned toolchain's rustdoc JSON format
ignore = "0.4.33"
similar = "3.2.0"
thiserror = "2.0.21"
anyhow = "1.0.104"
ulid = { version = "3.0.0", features = ["serde"] }
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
croner = "4.0.1"
iana-time-zone = "0.1.65"
rusqlite = { version = "0.40.2", features = ["bundled"] }
triviumdb = "=0.8.8"                     # 0.x, pinned exactly; only the derived memory index
imagesize = { version = "0.15.0", default-features = false, features = ["png", "jpeg", "webp"] }
zstd = { version = "0.13.3", default-features = false } # one-shot compression only
rand = "0.10.3"
# Response bodies are read as raw bytes, never decoded as text, so `charset` stays off.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
# What the plugin runtime uses: async components compiled by Cranelift, the on-disk cache and
# epoch interruption. Text formats, GC, threads, profilers and debuggers stay out of the binary;
# tests that write components as text enable `wat` themselves.
wasmtime = { version = "49.0.1", default-features = false, features = ["anyhow", "async", "backtrace", "cache", "component-model", "component-model-async", "cranelift", "parallel-compilation", "runtime", "std"] }
wasmtime-wasi = { version = "49.0.1", default-features = false, features = ["p2"] }
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
toml = "1.1.6"
dirs = "7.0.0"
cargo_metadata = "0.23.1"
wit-parser = "0.259.0"
wiremock = "0.6.5"
tempfile = "3.27.0"

enco-core = { path = "crates/enco-core" }
enco-kernel = { path = "crates/enco-kernel" }
enco-host = { path = "crates/enco-host" }
enco-wasm = { path = "crates/enco-wasm" }
enco-manual = { path = "crates/enco-manual" }

# Our crates orchestrate IO, and the hot paths live in dependencies, which Cargo never
# builds incrementally. Plugins keep clean builds because their bytes are content-addressed.
[profile.release]
incremental = true

# Published binaries: fat LTO over one codegen unit, optimized for size, symbols stripped. The Wasm
# compiler's hot paths keep full speed, so plugins compile as fast as at opt-level 3. These names
# follow wasmtime's crates; Cargo only warns when one no longer matches, so check them on upgrades.
[profile.dist]
inherits = "release"
incremental = false
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "symbols"
[profile.dist.package.cranelift-codegen]
opt-level = 3
[profile.dist.package.cranelift-assembler-x64]
opt-level = 3
[profile.dist.package.regalloc2]
opt-level = 3
[profile.dist.package.wasmparser]
opt-level = 3
[profile.dist.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dist.package.wasmtime-environ]
opt-level = 3

# Optimize the Wasm compiler's hot paths without slowing every dependency rebuild.
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2
[profile.dev.package.wasmparser]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2

# Independent workspaces copy this table; `cargo xtask check` verifies them.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Production code propagates errors with context instead of panicking.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
# Diagnostics go through tracing in the host and the `log` import in plugins.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Every suppression states why.
allow_attributes_without_reason = "deny"
# A function fits in one reading; a longer one splits by responsibility, or a flat
# dispatch states why with `expect`. Files have their own limit in `cargo xtask check`.
too_many_lines = "deny"
