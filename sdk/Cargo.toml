[package]
name = "enco-sdk"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[dependencies]
base64 = "0.22.1"
wit-bindgen = "0.62.0"
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Production code propagates errors with context instead of panicking.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
# Diagnostics go through tracing in the host and the `log` import in plugins.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Every suppression states why.
allow_attributes_without_reason = "deny"
# A function fits in one reading; a longer one splits by responsibility, or a flat
# dispatch states why with `expect`. Files have their own limit in `cargo xtask check`.
too_many_lines = "deny"
