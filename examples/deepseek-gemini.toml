[owner]
timezone = "America/New_York"

[endpoint.chat]
plugin = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_KEY"
options = { reasoning_effort = "low" }

window_tokens = 128000
max_output_tokens = 8192

[profile.default]
reply = ["chat"]
compaction = ["chat"]
# Defaults to the factory composer; another composer declares its own options schema.
# composer = { plugin = "composer", options = {} }

[endpoint.embed]
plugin = "openai-compatible"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
model = "gemini-embedding-001"
dimensions = 768
api_key_env = "GEMINI_KEY"
options = { dimensions = 768 }

[memory]
embedding = "embed"
# relevance = "relevance"

# Optional relevance filtering for automatically recalled memories.
# [endpoint.relevance]
# plugin = "typesafe"
# base_url = "https://api.typesafe.ai/v1"
# model = "jev-latest"
# api_key_env = "TYPESAFE_API_KEY"

[run]
max_rounds = 24

# Optional Telegram connection. Export the token variable before serving.
# [channel.telegram]
# plugin = "telegram"
# base_url = "https://api.telegram.org"
# owner = "123456789"
# secrets = { token = "TELEGRAM_BOT_TOKEN" }
# context = 0
# group_profile = "group"  # Omit to serve private chats only.

# A separate Session policy for group chats; only share tools safe for everyone in the group.
# [profile.group]
# reply = ["chat"]
# compaction = ["chat"]
# tools = ["web_search", "web_fetch"]
# owner_context = false
# requires_lifeline = false

# Optional Discord connection. Enable Message Content Intent in the developer portal.
# [channel.discord]
# plugin = "discord"
# base_url = "https://discord.com/api/v10"
# owner = "123456789012345678"
# secrets = { token = "DISCORD_BOT_TOKEN" }
# context = 0
# group_profile = "group"

# Optional QQ connection through SnowLuma's HTTP service with enableWebSocket enabled.
# Use a secondary QQ account and messageFormat = "array".
# [channel.qq]
# plugin = "onebot"
# base_url = "http://127.0.0.1:3000"
# owner = "123456789"
# secrets = { access_token = "ONEBOT_ACCESS_TOKEN" }
# context = 0
# group_profile = "group"
